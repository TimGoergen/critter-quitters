<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fly Strip Launcher — firing state: strip extending from barrel -->
  <!-- Fly strip ribbon extending upward from barrel -->
  <rect x="61" y="4" width="6" height="18" rx="3" fill="#E8C870"/>
  <rect x="62" y="3" width="4" height="6" rx="2" fill="#F5E088"/>
  <!-- Sticky dots on strip -->
  <circle cx="64" cy="7" r="1.5" fill="#B09030" opacity="0.70"/>
  <circle cx="64" cy="11" r="1.5" fill="#B09030" opacity="0.70"/>
  <circle cx="64" cy="15" r="1.5" fill="#B09030" opacity="0.70"/>
  <!-- Outer base disc shadow -->
  <circle cx="64" cy="64" r="44" fill="#6A0E52"/>
  <!-- Base disc — dark magenta -->
  <circle cx="64" cy="64" r="40" fill="#A81880"/>
  <!-- Main body cylinder — slightly wider (recoil squish) -->
  <circle cx="64" cy="64" r="30" fill="#E040C0"/>
  <!-- Body highlight ring -->
  <circle cx="64" cy="64" r="25" fill="#F060D4" opacity="0.50"/>
  <!-- Tape roll (same position) -->
  <circle cx="82" cy="58" r="14" fill="#D4964A"/>
  <circle cx="82" cy="58" r="8" fill="#EAB468"/>
  <circle cx="82" cy="58" r="4" fill="#604010"/>
  <circle cx="82" cy="58" r="2" fill="#3A2008"/>
  <!-- Barrel — slightly retracted/kicked back on fire -->
  <rect x="59" y="18" width="10" height="24" rx="5" fill="#C030A8"/>
  <rect x="60" y="18" width="8" height="8" rx="4" fill="#801880"/>
  <!-- Launch ring — glowing on fire -->
  <circle cx="64" cy="22" r="5" fill="none" stroke="#FF80E0" stroke-width="3"/>
  <circle cx="64" cy="22" r="3" fill="#FFB0F0" opacity="0.70"/>
  <!-- Body specular -->
  <ellipse cx="54" cy="52" rx="7" ry="5" fill="white" opacity="0.25"/>
  <!-- Base disc specular -->
  <ellipse cx="44" cy="44" rx="8" ry="5" fill="white" opacity="0.15"/>
  <!-- Tape roll specular -->
  <ellipse cx="78" cy="54" rx="4" ry="2.5" fill="white" opacity="0.30"/>
</svg>

  <!-- Dollar sign — S-curve: three cubic segments tracing the S shape -->
  <!-- Segment 1: top bowl  (41,25) → (29,26), curving up-left -->
  <!-- Segment 2: crossbar  (29,26) → (41,35), curving down-right -->
  <!-- Segment 3: bot bowl  (41,35) → (29,36), curving down-left -->
  <path
     d="M 41,25 C 41,21 29,21 29,26 C 29,30 41,30 41,35 C 41,39 29,39 29,36"
     fill="none"
     stroke="#90e090"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="path6"
     style="stroke:#edff00;stroke-opacity:1" />
  <!-- Specular highlight on the front bill (top-left corner) -->
  <ellipse
     cx="27.732006"
     cy="13.068154"
     rx="24.147123"
     ry="1.4058241"
     fill="#ffffff"
     opacity="0.15"
     id="ellipse7"
     style="opacity:0.35;stroke-width:1.17711" />
</svg>

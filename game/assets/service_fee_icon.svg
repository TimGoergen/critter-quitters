<?xml version="1.0" encoding="UTF-8"?>
<!-- Service Fee icon — two overlapping dollar bills (viewed from above-front).
     ViewBox 80×52 (bill-landscape proportion). Used in UI as a 2D TextureRect. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 52">

  <!-- Back bill (offset up-right to suggest a stack) -->
  <rect x="10" y="0" width="70" height="44" rx="4" fill="#1a5c1a"/>
  <rect x="10" y="0" width="70" height="44" rx="4" fill="none" stroke="#0a2e0a" stroke-width="2"/>
  <rect x="14" y="4"  width="62" height="36" rx="2" fill="none" stroke="#2e8c2e" stroke-width="1.5"/>

  <!-- Front bill -->
  <rect x="0"  y="8" width="70" height="44" rx="4" fill="#2b8a2b"/>
  <rect x="0"  y="8" width="70" height="44" rx="4" fill="none" stroke="#1a5c1a" stroke-width="2"/>
  <rect x="4"  y="12" width="62" height="36" rx="2" fill="none" stroke="#50c050" stroke-width="1.5"/>

  <!-- Oval medallion behind the dollar sign -->
  <ellipse cx="35" cy="30" rx="13" ry="13" fill="#185818" stroke="#50c050" stroke-width="1.5"/>

  <!-- Dollar sign — vertical stem -->
  <line x1="35" y1="21" x2="35" y2="39"
        stroke="#90e090" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dollar sign — S-curve: three cubic segments tracing the S shape -->
  <!-- Segment 1: top bowl  (41,25) → (29,26), curving up-left -->
  <!-- Segment 2: crossbar  (29,26) → (41,35), curving down-right -->
  <!-- Segment 3: bot bowl  (41,35) → (29,36), curving down-left -->
  <path d="M 41,25 C 41,21 29,21 29,26 C 29,30 41,30 41,35 C 41,39 29,39 29,36"
        fill="none" stroke="#90e090"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Specular highlight on the front bill (top-left corner) -->
  <ellipse cx="14" cy="16" rx="7" ry="3.5" fill="white" opacity="0.15"/>

</svg>

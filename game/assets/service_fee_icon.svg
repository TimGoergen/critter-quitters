     fill="#1a5c1a"
     id="rect1"
     ry="3.9999998"
     style="stroke-width:0.978024;fill:#124012;fill-opacity:1" />
  <rect
     x="9.97787"
     y="1.2665941"
     width="68.884407"
     height="42.755535"
     rx="4"
     fill="none"
     stroke="#0a2e0a"
     stroke-width="1.95574"
     id="rect2"
     ry="3.9999998"
     style="stroke:#258925;stroke-opacity:1" />
  <rect
     x="13.983741"
     y="5.1435924"
     width="61.259285"
     height="34.872665"

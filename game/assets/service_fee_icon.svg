<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Service Fee icon — two overlapping dollar bills (viewed from above-front).
     ViewBox 80×52 (bill-landscape proportion). Used in UI as a 2D TextureRect. -->

<svg
   viewBox="0 0 80 52"
   version="1.1"
   id="svg7"
   sodipodi:docname="service_fee_icon.svg"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs7" />
  <sodipodi:namedview
     id="namedview7"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="10.973753"
     inkscape:cx="22.872757"
     inkscape:cy="15.08144"
     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-x="-8"

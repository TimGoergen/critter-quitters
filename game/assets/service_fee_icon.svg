  <!-- Front bill -->
  <rect
     x="0.96654278"
     y="8"
     width="69.033455"
     height="42.906483"
     rx="4"
     fill="#2b8a2b"
     id="rect4"
     ry="4"
     style="stroke-width:0.980654;stroke:#50cf50;stroke-opacity:1" />
  <ellipse
     cx="36.935783"
     cy="6.233665"
     rx="24.147123"
     ry="1.4058241"
     fill="#ffffff"
     opacity="0.15"
     id="ellipse1"
     style="opacity:0.24;stroke-width:1.17711" />
  <rect
     x="1.168857"
     y="7.9767876"
     width="68.854355"
     height="42.679527"
     rx="3.9999998"
     fill="none"
     stroke="#1a5c1a"
     stroke-width="1.95357"
     id="rect5"
     ry="3.9999998"
     style="stroke-width:1.954;stroke-dasharray:none;stroke:#3de23d;stroke-opacity:1" />
  <rect
     x="4"
     y="12"
     width="62"
     height="36"
     rx="2"
     fill="none"
     stroke="#50c050"
     stroke-width="1.5"
     id="rect6"
     style="stroke:#50cf50;stroke-opacity:1" />
  <!-- Oval medallion behind the dollar sign -->
  <ellipse
     cx="35"
     cy="30"
     rx="13"
     ry="13"
     fill="#185818"
     stroke="#50c050"
     stroke-width="1.5"
     id="ellipse6"
     style="stroke:#50cf50;stroke-opacity:1" />
  <!-- Dollar sign — vertical stem -->
  <line
     x1="35"
     y1="21"

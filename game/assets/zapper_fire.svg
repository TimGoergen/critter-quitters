<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Flash outer glow -->
  <circle cx="64" cy="64" r="62" fill="#80AAFF" opacity="0.22"/>
  <!-- Outer housing ring — dark blue-gray -->
  <circle cx="64" cy="64" r="54" fill="#1A2A50"/>
  <!-- Housing body — bright blue (flash state) -->
  <circle cx="64" cy="64" r="48" fill="#2868FF"/>
  <!-- Electrode grid with bright flash tones -->
  <clipPath id="circ2">
    <circle cx="64" cy="64" r="46"/>
  </clipPath>
  <g clip-path="url(#circ2)">
    <line x1="20" y1="40" x2="108" y2="40" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="16" y1="50" x2="112" y2="50" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="14" y1="60" x2="114" y2="60" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="14" y1="70" x2="114" y2="70" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="16" y1="80" x2="112" y2="80" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="20" y1="90" x2="108" y2="90" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="30" y1="16" x2="30" y2="112" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="42" y1="14" x2="42" y2="114" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="54" y1="14" x2="54" y2="114" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="64" y1="14" x2="64" y2="114" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="74" y1="14" x2="74" y2="114" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="86" y1="14" x2="86" y2="114" stroke="#A0C8FF" stroke-width="2.5"/>
    <line x1="98" y1="16" x2="98" y2="112" stroke="#A0C8FF" stroke-width="2.5"/>
  </g>
  <!-- Electric arc lines -->
  <line x1="64" y1="64" x2="30" y2="30" stroke="#E0F0FF" stroke-width="3" stroke-linecap="round" opacity="0.90"/>
  <line x1="64" y1="64" x2="98" y2="30" stroke="#E0F0FF" stroke-width="3" stroke-linecap="round" opacity="0.90"/>
  <line x1="64" y1="64" x2="25" y2="70" stroke="#E0F0FF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="64" y1="64" x2="103" y2="58" stroke="#E0F0FF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Central flash — overbrightened emitter -->
  <circle cx="64" cy="64" r="26" fill="#D0E8FF" opacity="0.65"/>
  <ellipse cx="64" cy="64" rx="12" ry="16" fill="white" opacity="0.95"/>
  <!-- Core white hot spot -->
  <circle cx="64" cy="64" r="7" fill="white"/>
  <!-- Specular outer ring -->
  <ellipse cx="46" cy="34" rx="8" ry="5" fill="white" opacity="0.20"/>
</svg>

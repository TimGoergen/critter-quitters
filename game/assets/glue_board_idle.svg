<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Landscape glue board from above -->
  <!-- Dark cardboard border shadow -->
  <rect x="12" y="34" width="104" height="60" rx="5" fill="#3A2808"/>
  <!-- Cardboard base — warm tan -->
  <rect x="16" y="38" width="96" height="52" rx="3" fill="#C8924A"/>
  <!-- Red packaging end tabs -->
  <rect x="16" y="38" width="18" height="52" rx="3" fill="#CC1A08"/>
  <rect x="94" y="38" width="18" height="52" rx="3" fill="#CC1A08"/>
  <!-- Cardboard gap seam lines -->
  <line x1="34" y1="40" x2="34" y2="88" stroke="#3A2808" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="94" y1="40" x2="94" y2="88" stroke="#3A2808" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Amber adhesive surface -->
  <rect x="36" y="41" width="56" height="46" rx="2" fill="#FFCB1A" opacity="0.94"/>
  <!-- Gloss sheen on adhesive (light stripe) -->
  <rect x="38" y="43" width="20" height="40" rx="1" fill="white" opacity="0.14"/>
  <!-- Centre crease line -->
  <line x1="40" y1="64" x2="88" y2="64" stroke="#C8A000" stroke-width="2.5" stroke-linecap="round" opacity="0.70"/>
  <!-- Small sticker label on adhesive -->
  <rect x="52" y="55" width="24" height="18" rx="2" fill="#FFE860" opacity="0.70"/>
  <line x1="54" y1="61" x2="74" y2="61" stroke="#C4A000" stroke-width="1.5" opacity="0.60"/>
  <line x1="54" y1="65" x2="74" y2="65" stroke="#C4A000" stroke-width="1.5" opacity="0.60"/>
  <!-- Red tab specular highlights -->
  <ellipse cx="22" cy="50" rx="4" ry="6" fill="white" opacity="0.20"/>
  <ellipse cx="106" cy="50" rx="4" ry="6" fill="white" opacity="0.20"/>
</svg>

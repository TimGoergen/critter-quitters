<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dark perimeter border -->
  <rect x="34" y="11" width="60" height="106" rx="5" fill="#3D1A06"/>
  <!-- Wooden base -->
  <rect x="38" y="15" width="52" height="98" rx="3" fill="#9E6628"/>
  <!-- Wood grain lines -->
  <line x1="47" y1="18" x2="47" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="18" x2="64" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="81" y1="18" x2="81" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Coil spring (same position, slightly compressed look) -->
  <ellipse cx="64" cy="28" rx="13" ry="10" fill="#787880" stroke="#555560" stroke-width="1.5"/>
  <ellipse cx="64" cy="28" rx="8" ry="6.5" fill="#9A9AA4" stroke="#787880" stroke-width="1"/>
  <ellipse cx="64" cy="28" rx="3.5" ry="2.5" fill="#C0C0C8"/>
  <!-- Kill bar SNAPPED FLAT — full U lying across board -->
  <!-- Left arm runs from spring to near-bottom -->
  <rect x="49" y="24" width="6" height="74" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <!-- Right arm -->
  <rect x="73" y="24" width="6" height="74" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <!-- Crossbar at bottom -->
  <rect x="49" y="95" width="30" height="6" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <!-- Trigger plate (visible between the arms, bar on top) -->
  <rect x="55" y="67" width="18" height="11" rx="1" fill="#7A4820"/>
  <!-- Specular on spring -->
  <ellipse cx="61" cy="25" rx="4" ry="2.5" fill="white" opacity="0.22"/>
  <!-- Wire specular -->
  <ellipse cx="52" cy="58" rx="1.5" ry="8" fill="white" opacity="0.15"/>
  <ellipse cx="76" cy="58" rx="1.5" ry="8" fill="white" opacity="0.15"/>
</svg>

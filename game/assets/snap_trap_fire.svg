<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B87830"/>
      <stop offset="50%" stop-color="#9E6628"/>
      <stop offset="100%" stop-color="#7A4A18"/>
    </linearGradient>
  </defs>
  <!-- Floor shadow -->
  <ellipse cx="64" cy="114" rx="28" ry="5" fill="#000000" opacity="0.22"/>
  <!-- Dark perimeter border -->
  <rect x="34" y="11" width="60" height="106" rx="5" fill="#3D1A06"/>
  <!-- Wooden base -->
  <rect x="38" y="15" width="52" height="98" rx="3" fill="url(#woodGrad)"/>
  <!-- Wood grain lines -->
  <line x1="47" y1="18" x2="47" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="18" x2="64" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="81" y1="18" x2="81" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-edge sheen on wood -->
  <rect x="38" y="15" width="52" height="4" rx="2" fill="white" opacity="0.12"/>
  <!-- Coil spring (compressed after firing — flatter ellipses, center dropped 2px) -->
  <ellipse cx="64" cy="30" rx="13" ry="7" fill="#787880" stroke="#555560" stroke-width="1.5"/>
  <ellipse cx="64" cy="30" rx="8" ry="4.5" fill="#9A9AA4" stroke="#787880" stroke-width="1"/>
  <ellipse cx="64" cy="30" rx="3.5" ry="2" fill="#C0C0C8"/>
  <!-- Kill bar SNAPPED FLAT — full U lying across board -->
  <!-- Slightly warm tint vs idle's cool gray to read as just-fired -->
  <rect x="49" y="24" width="6" height="74" rx="3" fill="#C8C4BC" stroke="#9090A0" stroke-width="1"/>
  <rect x="73" y="24" width="6" height="74" rx="3" fill="#C8C4BC" stroke="#9090A0" stroke-width="1"/>
  <rect x="49" y="95" width="30" height="6" rx="3" fill="#C8C4BC" stroke="#9090A0" stroke-width="1"/>
  <!-- Impact flash along crossbar -->
  <ellipse cx="64" cy="97" rx="14" ry="3.5" fill="white" opacity="0.38"/>
  <!-- Snap lines from bar corners — suggest violent strike -->
  <line x1="49" y1="97" x2="39" y2="89" stroke="#D0B898" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="79" y1="97" x2="89" y2="89" stroke="#D0B898" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Trigger plate (visible between the arms) -->
  <rect x="55" y="67" width="18" height="11" rx="1" fill="#7A4820"/>
  <!-- Specular on spring -->
  <ellipse cx="61" cy="27" rx="4" ry="2" fill="white" opacity="0.22"/>
  <!-- Wire speculars -->
  <ellipse cx="52" cy="58" rx="1.5" ry="8" fill="white" opacity="0.15"/>
  <ellipse cx="76" cy="58" rx="1.5" ry="8" fill="white" opacity="0.15"/>
</svg>

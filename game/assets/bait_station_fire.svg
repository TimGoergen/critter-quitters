<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Bait Station grate — fire/pulse state: green glow added to transparent gaps -->
  <!-- The glow circles sit in the transparent areas; the bars are drawn on top -->

  <defs>
    <clipPath id="grate_area2">
      <rect x="16" y="16" width="96" height="96" rx="4"/>
    </clipPath>
  </defs>

  <!-- Green glow circles showing through transparent gap areas -->
  <circle cx="64" cy="64" r="42" fill="#30A840" opacity="0.22"/>
  <circle cx="64" cy="64" r="28" fill="#50D060" opacity="0.30"/>
  <circle cx="64" cy="64" r="16" fill="#80FF88" opacity="0.38"/>

  <!-- Diagonal bars at +45° -->
  <g clip-path="url(#grate_area2)" stroke="#404038" stroke-width="5" stroke-linecap="square">
    <line x1="20" y1="42" x2="42" y2="20"/>
    <line x1="20" y1="64" x2="64" y2="20"/>
    <line x1="20" y1="86" x2="86" y2="20"/>
    <line x1="20" y1="108" x2="108" y2="20"/>
    <line x1="42" y1="108" x2="108" y2="42"/>
    <line x1="64" y1="108" x2="108" y2="64"/>
    <line x1="86" y1="108" x2="108" y2="86"/>
  </g>
  <!-- Diagonal bars at -45° -->
  <g clip-path="url(#grate_area2)" stroke="#404038" stroke-width="5" stroke-linecap="square">
    <line x1="86" y1="20" x2="108" y2="42"/>
    <line x1="64" y1="20" x2="108" y2="64"/>
    <line x1="42" y1="20" x2="108" y2="86"/>
    <line x1="20" y1="20" x2="108" y2="108"/>
    <line x1="20" y1="42" x2="86" y2="108"/>
    <line x1="20" y1="64" x2="64" y2="108"/>
    <line x1="20" y1="86" x2="42" y2="108"/>
  </g>

  <!-- Outer frame bars -->
  <rect x="16" y="16" width="96" height="8"  rx="3" fill="#303428"/>
  <rect x="16" y="104" width="96" height="8" rx="3" fill="#303428"/>
  <rect x="16" y="16" width="8"  height="96" rx="3" fill="#303428"/>
  <rect x="104" y="16" width="8" height="96" rx="3" fill="#303428"/>

  <!-- Frame corner bolts (slightly greenish in pulse state) -->
  <circle cx="22"  cy="22"  r="3" fill="#485840"/>
  <circle cx="106" cy="22"  r="3" fill="#485840"/>
  <circle cx="22"  cy="106" r="3" fill="#485840"/>
  <circle cx="106" cy="106" r="3" fill="#485840"/>

  <ellipse cx="34" cy="20" rx="10" ry="3" fill="white" opacity="0.10"/>
</svg>

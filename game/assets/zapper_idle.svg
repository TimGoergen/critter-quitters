<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Outer housing ring — dark blue-gray -->
  <circle cx="64" cy="64" r="54" fill="#1A2A50"/>
  <!-- Housing body — blue -->
  <circle cx="64" cy="64" r="48" fill="#1A5ACC"/>
  <!-- Electrode grid — horizontal bars -->
  <line x1="20" y1="40" x2="108" y2="40" stroke="#4080FF" stroke-width="2.5"/>
  <line x1="16" y1="50" x2="112" y2="50" stroke="#4080FF" stroke-width="2.5"/>
  <line x1="14" y1="60" x2="114" y2="60" stroke="#4080FF" stroke-width="2.5"/>
  <line x1="14" y1="70" x2="114" y2="70" stroke="#4080FF" stroke-width="2.5"/>
  <line x1="16" y1="80" x2="112" y2="80" stroke="#4080FF" stroke-width="2.5"/>
  <line x1="20" y1="90" x2="108" y2="90" stroke="#4080FF" stroke-width="2.5"/>
  <!-- Electrode grid — vertical bars (clipped to circle via mask) -->
  <clipPath id="circ">
    <circle cx="64" cy="64" r="46"/>
  </clipPath>
  <g clip-path="url(#circ)">
    <line x1="30" y1="16" x2="30" y2="112" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="42" y1="14" x2="42" y2="114" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="54" y1="14" x2="54" y2="114" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="64" y1="14" x2="64" y2="114" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="74" y1="14" x2="74" y2="114" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="86" y1="14" x2="86" y2="114" stroke="#4080FF" stroke-width="2.5"/>
    <line x1="98" y1="16" x2="98" y2="112" stroke="#4080FF" stroke-width="2.5"/>
  </g>
  <!-- UV lamp center glow — soft blue -->
  <circle cx="64" cy="64" r="22" fill="#80AAFF" opacity="0.50"/>
  <!-- Central UV emitter (bright tube from above) -->
  <ellipse cx="64" cy="64" rx="10" ry="14" fill="#C0D8FF"/>
  <!-- UV tube highlight -->
  <ellipse cx="61" cy="59" rx="3.5" ry="5" fill="white" opacity="0.55"/>
  <!-- Outer ring specular -->
  <ellipse cx="46" cy="34" rx="8" ry="5" fill="white" opacity="0.15"/>
</svg>

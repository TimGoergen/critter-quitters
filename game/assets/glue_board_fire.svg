<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Glue board — enemy contact state: glue spread wider, surface disturbed -->
  <!-- Dark cardboard border shadow -->
  <rect x="12" y="34" width="104" height="60" rx="5" fill="#3A2808"/>
  <!-- Cardboard base — warm tan -->
  <rect x="16" y="38" width="96" height="52" rx="3" fill="#C8924A"/>
  <!-- Red packaging end tabs -->
  <rect x="16" y="38" width="18" height="52" rx="3" fill="#CC1A08"/>
  <rect x="94" y="38" width="18" height="52" rx="3" fill="#CC1A08"/>
  <!-- Cardboard gap seam lines -->
  <line x1="34" y1="40" x2="34" y2="88" stroke="#3A2808" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="94" y1="40" x2="94" y2="88" stroke="#3A2808" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Amber adhesive surface — slightly wider spread (contact/triggered) -->
  <rect x="34" y="39" width="60" height="50" rx="3" fill="#FFCB1A" opacity="0.97"/>
  <!-- Glue drip edges — irregular blobs at border -->
  <ellipse cx="34" cy="55" rx="5" ry="7" fill="#FFCB1A" opacity="0.80"/>
  <ellipse cx="34" cy="73" rx="4" ry="5" fill="#FFCB1A" opacity="0.75"/>
  <ellipse cx="94" cy="50" rx="5" ry="6" fill="#FFCB1A" opacity="0.80"/>
  <ellipse cx="94" cy="74" rx="4" ry="6" fill="#FFCB1A" opacity="0.75"/>
  <!-- Gloss sheen -->
  <rect x="36" y="41" width="22" height="44" rx="1" fill="white" opacity="0.16"/>
  <!-- Centre crease — disturbed -->
  <line x1="38" y1="64" x2="90" y2="64" stroke="#C8A000" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <!-- "Caught" ripple rings centered on board -->
  <ellipse cx="64" cy="64" rx="14" ry="10" fill="none" stroke="#FFE040" stroke-width="2" opacity="0.60"/>
  <ellipse cx="64" cy="64" rx="22" ry="16" fill="none" stroke="#FFE040" stroke-width="1.5" opacity="0.40"/>
  <!-- Red tab specular highlights -->
  <ellipse cx="22" cy="50" rx="4" ry="6" fill="white" opacity="0.20"/>
  <ellipse cx="106" cy="50" rx="4" ry="6" fill="white" opacity="0.20"/>
</svg>

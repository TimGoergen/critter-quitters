<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dark perimeter border -->
  <rect x="34" y="11" width="60" height="106" rx="5" fill="#3D1A06"/>
  <!-- Wooden base -->
  <rect x="38" y="15" width="52" height="98" rx="3" fill="#9E6628"/>
  <!-- Wood grain lines -->
  <line x1="47" y1="18" x2="47" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="18" x2="64" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="81" y1="18" x2="81" y2="110" stroke="#6A3C10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Coil spring (top end — from above = concentric ellipses) -->
  <ellipse cx="64" cy="28" rx="13" ry="10" fill="#787880" stroke="#555560" stroke-width="1.5"/>
  <ellipse cx="64" cy="28" rx="8" ry="6.5" fill="#9A9AA4" stroke="#787880" stroke-width="1"/>
  <ellipse cx="64" cy="28" rx="3.5" ry="2.5" fill="#C0C0C8"/>
  <!-- Kill bar (armed / raised — compact U visible near spring) -->
  <rect x="49" y="24" width="6" height="22" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <rect x="73" y="24" width="6" height="22" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <rect x="49" y="43" width="30" height="6" rx="3" fill="#C8C8D0" stroke="#9090A0" stroke-width="1"/>
  <!-- Trigger arm (metal rod from bar to trigger plate) -->
  <line x1="64" y1="49" x2="64" y2="65" stroke="#A0A0A8" stroke-width="3" stroke-linecap="round"/>
  <!-- Trigger plate -->
  <rect x="53" y="65" width="22" height="15" rx="2" fill="#5E3410"/>
  <rect x="55" y="67" width="18" height="11" rx="1" fill="#7A4820"/>
  <!-- Cheese wedge -->
  <polygon points="64,52 54,77 74,77" fill="#FFE614"/>
  <!-- Cheese holes -->
  <circle cx="64" cy="63" r="3" fill="#C4A010" opacity="0.9"/>
  <circle cx="58" cy="71" r="2.2" fill="#C4A010" opacity="0.9"/>
  <circle cx="71" cy="70" r="2.5" fill="#C4A010" opacity="0.9"/>
  <!-- Specular highlight on cheese -->
  <ellipse cx="60" cy="55" rx="4" ry="2.5" fill="white" opacity="0.28"/>
  <!-- Specular on spring -->
  <ellipse cx="61" cy="25" rx="4" ry="2.5" fill="white" opacity="0.22"/>
</svg>

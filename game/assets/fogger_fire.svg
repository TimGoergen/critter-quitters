<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Spray cloud puffs emanating from nozzle (drawn first, behind body) -->
  <circle cx="60" cy="8" r="9" fill="#A8E898" opacity="0.75"/>
  <circle cx="72" cy="6" r="7.5" fill="#C0F0A8" opacity="0.70"/>
  <circle cx="50" cy="10" r="7" fill="#A8E898" opacity="0.65"/>
  <circle cx="80" cy="10" r="7" fill="#C0F0A8" opacity="0.65"/>
  <circle cx="55" cy="4" r="5.5" fill="#D8F8C8" opacity="0.60"/>
  <circle cx="66" cy="3" r="5" fill="#D8F8C8" opacity="0.55"/>
  <!-- Outer body ring — dark green border -->
  <circle cx="64" cy="64" r="46" fill="#1E6010"/>
  <!-- Body — slightly squished/recoil effect, slightly wider green -->
  <circle cx="64" cy="64" r="42" fill="#4ACC1E"/>
  <!-- Yellow label band -->
  <circle cx="64" cy="64" r="32" fill="#D4D400"/>
  <!-- Gray shoulder dome -->
  <circle cx="64" cy="64" r="22" fill="#707078"/>
  <!-- Silver nozzle cap -->
  <circle cx="64" cy="64" r="13" fill="#B8B8C0"/>
  <!-- Nozzle center -->
  <circle cx="64" cy="64" r="5" fill="#888890"/>
  <!-- Nozzle arm — slightly longer on fire (extended) -->
  <rect x="62" y="12" width="8" height="24" rx="4" fill="#888890"/>
  <!-- Nozzle tip active — brighter orange -->
  <circle cx="66" cy="14" r="7" fill="#FF8830"/>
  <circle cx="66" cy="14" r="3.5" fill="#FFAA50"/>
  <!-- Inner spray burst from tip -->
  <circle cx="66" cy="8" r="5" fill="#E0FFD0" opacity="0.80"/>
  <!-- Body specular -->
  <ellipse cx="50" cy="38" rx="9" ry="6" fill="white" opacity="0.22"/>
  <!-- Dome specular -->
  <ellipse cx="60" cy="57" rx="5" ry="3.5" fill="white" opacity="0.30"/>
</svg>

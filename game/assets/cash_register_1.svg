<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Cash Register — stacked coins from above, frame 1 (B facing 12 o'clock) -->
  <!-- Bottom coin (largest) -->
  <circle cx="64" cy="66" r="48" fill="#186028"/>
  <circle cx="64" cy="66" r="44" fill="#28A040"/>
  <!-- Middle coin -->
  <circle cx="64" cy="64" r="36" fill="#229038"/>
  <circle cx="64" cy="64" r="32" fill="#30B048"/>
  <!-- Top coin — brightest -->
  <circle cx="64" cy="62" r="26" fill="#1A7830"/>
  <circle cx="64" cy="62" r="22" fill="#40C060"/>
  <!-- Top coin knurled edge ring -->
  <circle cx="64" cy="62" r="25" fill="none" stroke="#188030" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Bug Buck emblem on top coin — rotating "B" -->
  <g transform="rotate(0, 64, 62)">
    <!-- Green disc embossment -->
    <circle cx="64" cy="62" r="14" fill="#228840" opacity="0.80"/>
    <!-- "B" letterform as path -->
    <text x="64" y="67" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900"
          font-size="16" fill="#106020">B</text>
    <!-- Marker dot to show rotation direction -->
    <circle cx="64" cy="50" r="3" fill="#FFEE20"/>
  </g>
  <!-- Coin edge specular -->
  <ellipse cx="50" cy="48" rx="8" ry="5" fill="white" opacity="0.22"/>
  <!-- Top coin specular -->
  <ellipse cx="56" cy="54" rx="6" ry="3.5" fill="white" opacity="0.35"/>
</svg>

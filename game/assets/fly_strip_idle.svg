<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fly Strip Launcher from above: circular launcher body -->
  <!-- Outer base disc shadow -->
  <circle cx="64" cy="64" r="44" fill="#6A0E52"/>
  <!-- Base disc — dark magenta -->
  <circle cx="64" cy="64" r="40" fill="#A81880"/>
  <!-- Main body cylinder — bright magenta circle -->
  <circle cx="64" cy="64" r="28" fill="#E040C0"/>
  <!-- Body highlight ring -->
  <circle cx="64" cy="64" r="24" fill="#F060D4" opacity="0.50"/>
  <!-- Tape roll (tan crescent offset to +X side) -->
  <circle cx="82" cy="58" r="14" fill="#D4964A"/>
  <circle cx="82" cy="58" r="8" fill="#EAB468"/>
  <circle cx="82" cy="58" r="4" fill="#604010"/>
  <!-- Tape roll hole -->
  <circle cx="82" cy="58" r="2" fill="#3A2008"/>
  <!-- Barrel assembly extending toward -Z (toward top in SVG) -->
  <rect x="59" y="14" width="10" height="28" rx="5" fill="#C030A8"/>
  <!-- Barrel tip — darker end cap -->
  <rect x="60" y="14" width="8" height="8" rx="4" fill="#801880"/>
  <!-- Launch ring at barrel tip -->
  <circle cx="64" cy="18" r="5" fill="none" stroke="#FF80E0" stroke-width="2.5"/>
  <!-- Body specular -->
  <ellipse cx="54" cy="50" rx="7" ry="5" fill="white" opacity="0.25"/>
  <!-- Base disc specular -->
  <ellipse cx="44" cy="42" rx="8" ry="5" fill="white" opacity="0.15"/>
  <!-- Tape roll specular -->
  <ellipse cx="78" cy="54" rx="4" ry="2.5" fill="white" opacity="0.30"/>
</svg>
